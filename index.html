<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>patio에 초대합니다!</title>

<!-- Open Graph -->
<meta property="og:title" content="patio에 초대합니다!">
<meta property="og:description" content="크리에이티브를 위한 프라이빗 커뮤니티 patio. 그 첫번째 라운드에 멤버 여러분을 초대드립니다.">
<meta property="og:image" content="og-image.jpg">
<meta property="og:type" content="website">

<!-- Twitter Card (일부 미리보기 환경 대응) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="patio에 초대합니다!">
<meta name="twitter:description" content="크리에이티브를 위한 프라이빗 커뮤니티 patio. 그 첫번째 라운드에 멤버 여러분을 초대드립니다.">
<meta name="twitter:image" content="og-image.jpg">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    background: #000;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
  }

  /* 데스크탑에서도 모바일과 동일한 폭으로 보이도록 하고, 양옆은 블랙박스 */
  #stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #000;
    cursor: pointer;
  }

  /* 이미지가 뜨기 전까지 화면을 완전히 검게 덮는 오버레이 */
  #veil {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10;
    opacity: 1;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  #veil.hide {
    opacity: 0;
  }

  #main-image {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
  }

  /* 사운드 상태 안내 */
  #sound-hint {
    position: fixed;
    left: 0; right: 0; bottom: 24px;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #sound-hint.show { opacity: 1; }
</style>
</head>
<body>

<div id="veil"></div>
<div id="sound-hint">화면을 클릭하면 사운드가 꺼집니다</div>

<div id="stage">
  <!-- 메인 이미지: patioinvi.png -->
  <img id="main-image" src="patioinvi.png" alt="patio">
</div>

<audio id="bg-audio" src="0906.MP3" preload="auto" playsinline loop></audio>

<script>
(function () {
  var img = document.getElementById('main-image');
  var veil = document.getElementById('veil');
  var audio = document.getElementById('bg-audio');
  var soundHint = document.getElementById('sound-hint');

  var revealed = false;
  var FADE_LEAD_MS = 700; // 오디오를 이미지보다 0.7초 먼저 시작
  var hintTimer = null;

  function flashHint(text) {
    soundHint.textContent = text;
    soundHint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      soundHint.classList.remove('show');
    }, 2600);
  }

  function tryAutoplay() {
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () {
        // 자동재생이 막힌 경우: 클릭 시 재생되도록 안내
        flashHint('화면을 클릭하면 사운드가 재생됩니다');
      });
    }
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    veil.classList.add('hide');
  }

  // 오디오를 이미지보다 0.7초 먼저 시작하고, 0.7초 후 이미지를 부드럽게 노출
  function beginSequence() {
    tryAutoplay();
    setTimeout(reveal, FADE_LEAD_MS);
  }

  // 이미지가 버벅이지 않도록: decode()로 완전히 디코딩된 후에만 시퀀스 시작
  function decodeAndStart() {
    if (img.decode) {
      img.decode().then(beginSequence).catch(beginSequence);
    } else {
      beginSequence();
    }
  }

  if (img.complete) {
    decodeAndStart();
  } else {
    img.addEventListener('load', decodeAndStart, { once: true });
  }

  // 혹시 이미지 로드가 지나치게 늦어질 경우를 대비한 안전장치 (8초 후 강제 진행)
  setTimeout(function () {
    if (!revealed) beginSequence();
  }, 8000);

  // 화면 클릭 시 사운드 on/off 토글 (다시 누르면 다시 재생)
  document.body.addEventListener('click', function () {
    if (audio.paused) {
      audio.play().then(function () {
        flashHint('화면을 클릭하면 사운드가 꺼집니다');
      }).catch(function () {});
    } else {
      audio.pause();
      flashHint('화면을 클릭하면 사운드가 다시 재생됩니다');
    }
  });
})();
</script>

</body>
</html>
