<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>patio에 초대합니다!</title>

<!-- Open Graph -->
<meta property="og:title" content="patio에 초대합니다!">
<meta property="og:description" content="크리에이티브를 위한 프라이빗 커뮤니티 patio. 그 첫번째 라운드에 멤버 여러분을 초대드립니다.">
<meta property="og:image" content="og-image.jpg">
<meta property="og:type" content="website">

<!-- Twitter Card (일부 미리보기 환경 대응) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="patio에 초대합니다!">
<meta name="twitter:description" content="크리에이티브를 위한 프라이빗 커뮤니티 patio. 그 첫번째 라운드에 멤버 여러분을 초대드립니다.">
<meta name="twitter:image" content="og-image.jpg">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    background: #000;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
  }

  /* 이미지가 뜨기 전까지 화면을 완전히 검게 덮는 오버레이 */
  #veil {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10;
    opacity: 1;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  #veil.hide {
    opacity: 0;
  }

  .wrap {
    width: 100%;
    background: #000;
  }

  #main-image {
    display: block;
    width: 100%;
    height: auto;
    /* 디코딩 전 레이아웃 흔들림 방지 */
    background: #000;
  }

  /* 첫 탭 유도용 안내 (모바일 오디오 자동재생 정책 대응) */
  #tap-hint {
    position: fixed;
    left: 0; right: 0; bottom: 24px;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #tap-hint.show { opacity: 1; }
</style>
</head>
<body>

<div id="veil"></div>
<div id="tap-hint">사운드를 재생하려면 화면을 탭하세요</div>

<div class="wrap">
  <!-- 메인 이미지: patioinvi.png -->
  <img id="main-image" src="patioinvi.png" alt="patio">
</div>

<audio id="bg-audio" src="0906.MP3" preload="auto" playsinline></audio>

<script>
(function () {
  var img = document.getElementById('main-image');
  var veil = document.getElementById('veil');
  var audio = document.getElementById('bg-audio');
  var tapHint = document.getElementById('tap-hint');

  var revealed = false;
  var FADE_LEAD_MS = 700; // 오디오를 이미지보다 0.7초 먼저 시작

  audio.loop = true; // 끝나면 처음부터 반복 재생

  function startAudio() {
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () {
        // 모바일 자동재생 정책에 막힌 경우: 첫 사용자 탭으로 재생
        tapHint.classList.add('show');
        var resume = function () {
          audio.play().then(function () {
            tapHint.classList.remove('show');
          }).catch(function(){});
          window.removeEventListener('touchstart', resume);
          window.removeEventListener('click', resume);
        };
        window.addEventListener('touchstart', resume, { once: true, passive: true });
        window.addEventListener('click', resume, { once: true });
      });
    }
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    veil.classList.add('hide');
  }

  // 오디오를 이미지보다 0.7초 먼저 시작하고, 0.7초 후 이미지를 부드럽게 노출
  function beginSequence() {
    startAudio();
    setTimeout(reveal, FADE_LEAD_MS);
  }

  // 이미지가 버벅이지 않도록: decode()로 완전히 디코딩된 후에만 시퀀스 시작
  if (img.complete) {
    decodeAndStart();
  } else {
    img.addEventListener('load', decodeAndStart, { once: true });
  }

  function decodeAndStart() {
    if (img.decode) {
      img.decode().then(beginSequence).catch(beginSequence);
    } else {
      beginSequence();
    }
  }

  // 혹시 이미지 로드가 지나치게 늦어질 경우를 대비한 안전장치 (8초 후 강제 진행)
  setTimeout(function () {
    if (!revealed) beginSequence();
  }, 8000);
})();
</script>

</body>
</html>
