<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>patio에 초대합니다!</title>

<!-- Open Graph -->
<meta property="og:title" content="patio에 초대합니다!">
<meta property="og:description" content="크리에이티브를 위한 프라이빗 커뮤니티 patio. 그 첫번째 라운드에 멤버 여러분을 초대드립니다.">
<meta property="og:image" content="og-image.jpg">
<meta property="og:type" content="website">

<!-- Twitter Card (일부 미리보기 환경 대응) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="patio에 초대합니다!">
<meta name="twitter:description" content="크리에이티브를 위한 프라이빗 커뮤니티 patio. 그 첫번째 라운드에 멤버 여러분을 초대드립니다.">
<meta name="twitter:image" content="og-image.jpg">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    background: #000;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
  }

  /* 데스크탑에서도 모바일과 동일한 폭으로 보이도록 하고, 양옆은 블랙박스 */
  #stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #000;
    cursor: pointer;
  }

  /* 이미지가 뜨기 전까지 화면을 완전히 검게 덮는 오버레이 */
  #veil {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10;
    opacity: 1;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  #veil.hide {
    opacity: 0;
  }

  #main-image {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
  }

  /* 하단 고정 떠다니는 가입 버튼 + 안내 문구 wrapper */
  #join-wrap {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 30;
    width: 60.48%;
    max-width: 317px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #audio-hint {
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    pointer-events: none;
    margin-bottom: 10px;
    animation: hint-blink 1.6s ease-in-out infinite;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }

  @keyframes hint-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  #join-btn {
    position: relative;
    width: 100%;
    z-index: 30;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 0;
    display: block;
    animation: join-float 2.6s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45));
  }
  #join-btn img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
  }
  #join-btn.tapped {
    animation: none;
    transform: scale(0.92);
  }

  @keyframes join-float {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }

  /* 커뮤니티 운영 문의 안내 사이 빈 공간에 배치되는 문의 버튼 */
  #quest-btn {
    position: absolute;
    left: 50%;
    top: 96.68%;
    transform: translate(-50%, -50%);
    width: 44%;
    z-index: 5;
    cursor: pointer;
    display: block;
    text-decoration: none;
  }
  #quest-btn img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
  }
  #quest-btn.tapped {
    transform: translate(-50%, -50%) scale(0.92);
  }
</style>
</head>
<body>

<div id="veil"></div>

<div id="stage">
  <!-- 메인 이미지: patioinvi.png -->
  <img id="main-image" src="patioinvi.png" alt="patio">

  <!-- 커뮤니티 운영 문의 문구 위 빈 공간에 배치되는 문의 버튼 -->
  <a id="quest-btn" href="mailto:support@inmybackyard.kr" aria-label="문의하기">
    <img src="quest.svg" alt="문의하기">
  </a>
</div>

<audio id="bg-audio" src="0906.MP3" preload="auto" playsinline loop></audio>

<div id="join-wrap">
  <div id="audio-hint">클릭 시 오디오가 재생됩니다</div>
  <button id="join-btn" type="button" aria-label="가입하기">
    <img src="join.svg" alt="가입하기">
  </button>
</div>

<script>
(function () {
  var img = document.getElementById('main-image');
  var veil = document.getElementById('veil');
  var audio = document.getElementById('bg-audio');

  var revealed = false;
  var FADE_LEAD_MS = 700; // 오디오를 이미지보다 0.7초 먼저 시작
  var userPaused = false; // 사용자가 직접 정지시킨 경우 스크롤로 재생 재개하지 않음

  function tryAutoplay() {
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () {
        // 자동재생이 막힌 경우: 문구 없이 첫 사용자 터치/클릭에서 조용히 재생
        var resume = function () {
          audio.play().catch(function () {});
          window.removeEventListener('touchstart', resume);
          window.removeEventListener('click', resume);
        };
        window.addEventListener('touchstart', resume, { once: true, passive: true });
        window.addEventListener('click', resume, { once: true });
      });
    }
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    veil.classList.add('hide');
  }

  // 오디오를 이미지보다 0.7초 먼저 시작하고, 0.7초 후 이미지를 부드럽게 노출
  function beginSequence() {
    tryAutoplay();
    setTimeout(reveal, FADE_LEAD_MS);
  }

  // 이미지가 버벅이지 않도록: decode()로 완전히 디코딩된 후에만 시퀀스 시작
  function decodeAndStart() {
    if (img.decode) {
      img.decode().then(beginSequence).catch(beginSequence);
    } else {
      beginSequence();
    }
  }

  if (img.complete) {
    decodeAndStart();
  } else {
    img.addEventListener('load', decodeAndStart, { once: true });
  }

  // 혹시 이미지 로드가 지나치게 늦어질 경우를 대비한 안전장치 (8초 후 강제 진행)
  setTimeout(function () {
    if (!revealed) beginSequence();
  }, 8000);

  // 하단 가입 버튼: 클릭 효과 후 구글폼으로 리디렉션 (사운드 토글과 분리)
  var joinBtn = document.getElementById('join-btn');
  var JOIN_URL = 'https://forms.gle/HCYNfYa1C2XdahfZ8';
  joinBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    joinBtn.classList.add('tapped');
    setTimeout(function () {
      window.location.href = JOIN_URL;
    }, 160);
  });

  // 커뮤니티 운영 문의 버튼: 클릭 효과만 추가 (실제 메일 이동은 a 태그의 mailto가 처리, 사운드 토글과 분리)
  var questBtn = document.getElementById('quest-btn');
  questBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    questBtn.classList.add('tapped');
    setTimeout(function () {
      questBtn.classList.remove('tapped');
    }, 160);
  });

  // 자동재생이 막힌 브라우저 대응: 스크롤만 해도 바로 오디오 재생 시도
  window.addEventListener('scroll', function () {
    if (audio.paused && !userPaused) {
      audio.play().catch(function () {});
    }
  }, { passive: true });

  // 화면 클릭 시 사운드 on/off 토글 (다시 누르면 다시 재생)
  document.body.addEventListener('click', function () {
    if (audio.paused) {
      audio.play().catch(function () {});
      userPaused = false;
    } else {
      audio.pause();
      userPaused = true;
    }
  });
})();
</script>

</body>
</html>
